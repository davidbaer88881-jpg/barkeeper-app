<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Barkeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#0a0612;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);
  --txt:#f6f1fb;--mut:#a99cbc;--pink:#ff3d9a;--vio:#8b5cf6;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#fb7185;
  --grad:linear-gradient(135deg,#ff3d9a 0%,#8b5cf6 55%,#22d3ee 100%);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(60vmax 60vmax at 110% -10%,rgba(139,92,246,.28),transparent 60%),
  radial-gradient(50vmax 50vmax at -20% 30%,rgba(255,61,154,.18),transparent 60%),
  radial-gradient(50vmax 50vmax at 50% 120%,rgba(34,211,238,.14),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.shell{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(10,6,18,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 24px rgba(255,61,154,.35);flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--mut);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.18);animation:pulse 2s infinite}
.dot.wait{background:var(--amber);animation:blink 1s infinite}
.dot.off{background:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(52,211,153,0)}}
@keyframes blink{50%{opacity:.3}}
main{flex:1;padding:18px 16px 120px}
.h2{font-size:22px;font-weight:800;margin:6px 4px 14px;letter-spacing:-.02em}
.muted{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line);transition:transform .12s,filter .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--grad);border:0;box-shadow:0 8px 28px rgba(255,61,154,.3)}
.btn.ok{background:linear-gradient(135deg,#10b981,#34d399);border:0;color:#04140d;box-shadow:0 6px 22px rgba(52,211,153,.3)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:0;color:#1c1203}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(251,113,133,.35)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn.lg{padding:17px 26px;font-size:18px;border-radius:18px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
input.in,select.in,textarea.in{width:100%;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--vio);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
select.in option{background:#1a1226}
label.lb{display:block;font-size:13px;color:var(--mut);margin:0 0 6px 4px;font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--txt);color:#140b20;border-color:transparent}
.chip .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:rgba(255,255,255,.12);font-size:12px}
.chip.on .n{background:rgba(0,0,0,.12)}
/* bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(10,6,18,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.bot .in{display:flex;gap:4px;max-width:760px;width:100%;justify-content:space-around}
nav.bot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;color:var(--mut);font-size:11.5px;font-weight:600;position:relative}
nav.bot button .ic{font-size:21px;filter:grayscale(.6);transition:transform .2s}
nav.bot button.on{color:var(--txt);background:var(--card)}
nav.bot button.on .ic{filter:none;transform:translateY(-1px) scale(1.1)}
.bdg{position:absolute;top:0;right:calc(50% - 22px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
/* orders */
.olist{display:grid;gap:12px}
@media(min-width:700px){.olist{grid-template-columns:1fr 1fr}}
.order{position:relative;border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.order::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--mut)}
.order.st-new::before{background:var(--pink)}
.order.st-new{border-color:rgba(255,61,154,.35);box-shadow:0 0 0 1px rgba(255,61,154,.08),0 10px 40px rgba(255,61,154,.12)}
.order.st-prep::before{background:var(--amber)}
.order.st-ready::before{background:var(--green)}
.order.st-done,.order.st-cancel{opacity:.6}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.o-top{display:flex;gap:12px;align-items:center}
.o-num{font-size:26px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:58px}
.o-name{font-weight:700;font-size:17px}
.o-time{color:var(--mut);font-size:13px}
.tag{margin-left:auto;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2)}
.tag.new{background:rgba(255,61,154,.18);color:#ff8cc4}
.tag.prep{background:rgba(251,191,36,.16);color:var(--amber)}
.tag.ready{background:rgba(52,211,153,.16);color:var(--green)}
.tag.cancel{background:rgba(251,113,133,.15);color:var(--red)}
.o-items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.o-items li{display:flex;gap:10px;align-items:center;font-size:16px}
.o-items .q{min-width:34px;padding:3px 0;text-align:center;border-radius:9px;background:var(--card2);font-weight:800;font-size:14px}
.o-note{margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(251,191,36,.1);color:#fde68a;font-size:14px}
.o-foot{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.o-total{font-weight:700;color:var(--mut);margin-right:auto}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{font-size:56px;margin-bottom:8px;filter:drop-shadow(0 8px 24px rgba(139,92,246,.4))}
/* menu manage */
.cat-h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:22px 6px 10px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.item .em{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:26px;flex:none}
.item .nm{font-weight:700}
.item .ds{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pr{font-weight:700;white-space:nowrap}
.item.so .em,.item.so .nm,.item.so .pr{opacity:.4}
.flex1{flex:1;min-width:0}
.tgl{position:relative;width:46px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--line);flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{background:var(--green);border-color:transparent}
.tgl.on::after{transform:translateX(18px)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emojis button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.emojis button.on{border-color:var(--pink);background:rgba(255,61,154,.15)}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.03em}
.stat .k{color:var(--mut);font-size:13px;font-weight:600}
.stat.hl{background:var(--grad);border:0}
.stat.hl .k{color:rgba(255,255,255,.85)}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-row .lbl{width:38%;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .trk{flex:1;height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar-row .fil{height:100%;border-radius:99px;background:var(--grad)}
.bar-row .cnt{width:34px;text-align:right;font-weight:700;color:var(--mut)}
/* QR */
.qrwrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.qrbox{background:#fff;padding:18px;border-radius:28px;width:min(78vw,340px);box-shadow:0 20px 70px rgba(139,92,246,.35),0 0 0 6px rgba(255,255,255,.06)}
.qrbox svg{width:100%;height:auto;display:block}
.link{font-size:12.5px;color:var(--mut);word-break:break-all;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);max-width:100%}
.warnbox{padding:12px 14px;border-radius:14px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:14px;text-align:left}
.full{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;
  background:radial-gradient(70vmax 70vmax at 50% 0%,rgba(139,92,246,.35),transparent 60%),radial-gradient(60vmax 60vmax at 50% 110%,rgba(255,61,154,.3),transparent 60%),var(--bg)}
.full h2{font-size:clamp(28px,7vw,54px);margin:0;font-weight:800;letter-spacing:-.03em}
.full .qrbox{width:min(70vw,58vh,460px)}
.gradtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* splash */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
.splash .logo{width:96px;height:96px;border-radius:30px;font-size:52px;animation:float 3s ease-in-out infinite}
.splash h1{font-size:44px;margin:6px 0 0;font-weight:800;letter-spacing:-.04em}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
/* guest */
.banner{margin:0 0 14px;padding:12px 16px;border-radius:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.banner.hh{background:linear-gradient(135deg,rgba(255,61,154,.25),rgba(251,191,36,.2));border:1px solid rgba(255,61,154,.35)}
.banner.cl{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:11px;border-radius:12px;font-weight:700;color:var(--mut);position:relative}
.seg button.on{background:var(--txt);color:#140b20}
.seg .bdg{top:-6px;right:12px}
.drinks{display:grid;gap:10px}
@media(min-width:620px){.drinks{grid-template-columns:1fr 1fr}}
.drink{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:border .2s,background .2s}
.drink.has{border-color:rgba(255,61,154,.5);background:rgba(255,61,154,.07)}
.drink .em{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,rgba(255,61,154,.18),rgba(139,92,246,.18));flex:none}
.drink .nm{font-weight:700;font-size:16.5px}
.drink .ds{color:var(--mut);font-size:13px;margin-top:2px}
.drink .pr{margin-top:6px;font-weight:800}
.drink .pr s{color:var(--mut);font-weight:500;margin-right:6px;font-size:13px}
.drink.so{opacity:.45}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px;font-weight:700;display:grid;place-items:center}
.qty button.add{background:var(--grad);border:0}
.qty span{min-width:20px;text-align:center;font-weight:800;font-size:17px}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:22px;background:var(--grad);box-shadow:0 16px 50px rgba(255,61,154,.45);animation:up .35s cubic-bezier(.2,1.3,.4,1)}
.cartbar b{font-size:17px}
.cartbar .btn{margin-left:auto;background:#fff;color:#140b20;border:0}
@keyframes up{from{transform:translateY(120%)}}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:760px;margin:0 auto;max-height:88vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:#160f22;border:1px solid var(--line);border-bottom:0;animation:up .3s cubic-bezier(.2,1.1,.4,1)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
@keyframes fade{from{opacity:0}}
.line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:16px 2px}
.track{display:flex;gap:6px;margin:14px 0 4px}
.track div{flex:1;height:6px;border-radius:9px;background:var(--card2)}
.track div.on{background:var(--grad)}
.track div.ok{background:var(--green)}
.steps{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600}
.steps .on{color:var(--txt)}
.gorder.ready{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.08);box-shadow:0 0 40px rgba(52,211,153,.18);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 60px rgba(52,211,153,.35)}}
.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;background:radial-gradient(80vmax 80vmax at 50% 40%,rgba(52,211,153,.32),transparent 60%),#0a0612;animation:fade .3s}
.overlay .gl{font-size:110px;animation:cheers 1s ease-in-out infinite}
.overlay h2{font-size:clamp(32px,9vw,52px);margin:0;font-weight:800;letter-spacing:-.03em}
.overlay .num{font-size:64px;font-weight:800;letter-spacing:-.04em;color:var(--green)}
@keyframes cheers{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.12)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:201;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:300;padding:12px 18px;border-radius:16px;background:#fff;color:#140b20;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,1.3,.4,1);max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--card2);border-top-color:var(--pink);animation:rot 1s linear infinite;margin:0 auto 16px}
@keyframes rot{to{transform:rotate(360deg)}}
.namechip{padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.sec{margin-top:14px}
/* Statistik, Rankings, Bewertungen */
.stat{position:relative}
.rs{position:absolute;top:10px;right:10px;height:28px;min-width:28px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.1);font-size:14px;font-weight:700;color:var(--txt);z-index:2;white-space:nowrap}
.rs.ask{background:var(--red);color:#fff;font-size:12px}
.stat.hl .rs{background:rgba(0,0,0,.2)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 6px 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;min-height:28px}
.sh .rs{position:static;letter-spacing:0;text-transform:none}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:10px}
.pod{position:relative;text-align:center;padding:14px 8px 12px;border-radius:20px 20px 14px 14px;background:var(--card);border:1px solid var(--line);min-width:0;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.pod[data-a]{cursor:pointer}
.pod.r1{order:2;padding-top:24px;background:linear-gradient(180deg,rgba(251,191,36,.28),rgba(251,191,36,.04));border-color:rgba(251,191,36,.55);box-shadow:0 10px 40px rgba(251,191,36,.18)}
.pod.r2{order:1;background:linear-gradient(180deg,rgba(203,213,225,.18),rgba(203,213,225,.03))}
.pod.r3{order:3;background:linear-gradient(180deg,rgba(217,119,6,.22),rgba(217,119,6,.03))}
.pod .md{font-size:26px;line-height:1}
.pod .pe{font-size:36px;margin:6px 0 4px}
.pod.r1 .pe{font-size:46px}
.pod .nm,.rcard .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .q,.rcard .q{color:var(--mut);font-size:12.5px;font-weight:600}
.pod .rk{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rcard{position:relative;padding:14px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-width:0}
.rcard .k{color:var(--mut);font-size:12.5px;font-weight:700;padding-right:30px;white-space:nowrap}
.rcard .pe{font-size:34px;margin:8px 0 2px}
.rcard .sub{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard.mini{text-align:center;padding:12px 8px}
.rcard.mini .k{padding:0}
.rcard.mini .pe{font-size:28px;margin:6px 0 0}
.stars{color:var(--amber);letter-spacing:1px}
.stars.lg{font-size:22px}
.rt{margin-top:4px;font-size:13px}
.rt b{margin:0 2px}

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- Helfer ---------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (n = 8) => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; };
const eur = v => (Math.round(v * 100) / 100).toLocaleString('de-DE', {style:'currency', currency:'EUR'});
const hhmm = ts => new Date(ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
const ago = ts => { const m = Math.floor((Date.now() - ts) / 60000); return m < 1 ? 'gerade eben' : m < 60 ? `vor ${m} Min` : `vor ${Math.floor(m/60)} Std`; };
const discounted = (p, hh) => Math.round(p * (100 - (hh || 0))) / 100;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

let actx;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {} }
function chime(kind) {
  if (!actx) return;
  const notes = kind === 'ready' ? [523, 659, 784, 1047] : kind === 'cancel' ? [740, 554, 415, 311] : [988, 740, 988];
  notes.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.13;
    o.type = kind === 'cancel' ? 'square' : 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(kind === 'cancel' ? 0.18 : 0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.55);
  });
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
let baseTitle = document.title, flashT = null;
function flashTitle(msg) {
  if (!document.hidden) return; clearInterval(flashT); let on = false;
  flashT = setInterval(() => { document.title = (on = !on) ? msg : baseTitle; }, 1000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearInterval(flashT); document.title = baseTitle; if (wakeLock !== null) keepAwake(); } });
function copyText(txt) {
  const done = () => toast('Link kopiert ✓');
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch { toast('Bitte Link manuell kopieren'); } ta.remove(); }
}
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag(8, 2).replace(/\swidth="[^"]*"/, '').replace(/\sheight="[^"]*"/, '');
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const em = ['🎉','✨','🍹','🥂','💥','⭐'];
  for (let i = 0; i < 36; i++) { const e = document.createElement('i'); e.textContent = em[i % em.length]; e.style.left = Math.random() * 100 + 'vw'; e.style.animationDuration = 2 + Math.random() * 2.5 + 's'; e.style.animationDelay = Math.random() * .8 + 's'; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5500);
}
/* Re-render nicht während getippt wird */
let pendingRender = null;
function safeRender(fn) {
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && app.contains(ae)) { pendingRender = fn; return; }
  fn();
}
document.addEventListener('focusout', () => setTimeout(() => {
  const ae = document.activeElement;
  if (pendingRender && !(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA'))) { const f = pendingRender; pendingRender = null; f(); }
}, 450));

/* Öffentliche Nachrichten-Server (Relay) – Bar und Gäste nutzen denselben */
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const STAT_KEYS = ['rev', 'orders', 'drinks', 'guests', 'wait', 'peak', 'today', 'top3', 'week', 'month', 'alltime', 'reviews'];
const starStr = v => { const f = Math.max(0, Math.min(5, Math.round(v))); return '★'.repeat(f) + '☆'.repeat(5 - f); };
const MEDALS = ['🥇', '🥈', '🥉'];
const pad2 = n => String(n).padStart(2, '0');
function podiumHtml(list, attr) {
  return `<div class="podium">${list.map((x, i) => `<div class="pod r${i + 1}" ${attr ? attr(x) : ''}><div class="md">${MEDALS[i]}</div><div class="pe">${esc(x.e || '🍹')}</div><div class="nm">${esc(x.n)}</div><div class="q">${x.q}× verkauft</div><div class="rk">Platz ${i + 1}</div></div>`).join('')}</div>`;
}
const STATUS = { sending:'Wird gesendet…', new:'Eingegangen', prep:'Wird gemixt', ready:'Fertig – abholen!', done:'Abgeholt', cancel:'Storniert' };
const EMOJIS = ['🍹','🍸','🍺','🍻','🍷','🥂','🥃','🍾','🧉','🍶','🥤','🧃','☕','💧','🍋','🍓','🍊','🥥','🍉','🔥','❄️','🌶️','🍫','🥨'];

/* ================================================================
   BARKEEPER
   ================================================================ */
const Bar = {
  S: null, client: null, guests: new Map(), view: 'orders', filter: 'open', status: 'offline',
  started: false, confirm: null, formOpen: false, newEmoji: '🍹', full: false, resetAsk: false,

  defaults() {
    const m = (cat, emoji, name, price, desc = '') => ({ id: 'd-' + uid(6), cat, emoji, name, price, desc, soldOut: false });
    return {
      barName: 'Neon Bar', peerId: null, open: true, happy: 0, free: false, counter: { day: '', n: 0 }, orders: [],
      reviews: [], resets: {}, agg: { top3: {}, alltime: {} },
      menu: [
        m('Cocktails','🍹','Mojito',8.5,'Rum, Minze, Limette, Soda'),
        m('Cocktails','🍊','Aperol Spritz',7,'Aperol, Prosecco, Soda'),
        m('Cocktails','🍸','Gin Tonic',7.5,'Gin, Tonic, Gurke'),
        m('Cocktails','🥥','Piña Colada',8.5,'Rum, Kokos, Ananas'),
        m('Bier','🍺','Helles 0,5 l',4.2),
        m('Bier','🍻','Weißbier 0,5 l',4.5),
        m('Bier','🍋','Radler 0,5 l',4),
        m('Shots','🥃','Tequila',3,'mit Salz & Zitrone'),
        m('Shots','🔥','Jägermeister',3),
        m('Alkoholfrei','🍓','Virgin Mojito',5.5,'Minze, Limette, Erdbeere'),
        m('Alkoholfrei','🥤','Cola 0,3 l',3.2),
        m('Alkoholfrei','💧','Wasser 0,5 l',2.5)
      ]
    };
  },
  init() {
    this.S = store.get('bk_bar', null) || this.defaults();
    if (!this.S.peerId) { this.S.peerId = 'bk-' + uid(12); this.save(); }
    this.migrate();
    this.render();
    setInterval(() => { if (this.started && (this.view === 'orders')) safeRender(() => this.renderBody()); }, 30000);
    setInterval(() => this.watchdog(), 6000);
  },
  save() { store.set('bk_bar', this.S); },
  migrate() {
    const S = this.S;
    if (!Array.isArray(S.reviews)) S.reviews = [];
    if (!S.resets || typeof S.resets !== 'object') S.resets = {};
    if (!Array.isArray(S.gcIds)) S.gcIds = [];
    if (!S.agg || typeof S.agg !== 'object') { S.agg = { top3: {}, alltime: {} }; (S.orders || []).filter(o => o.status !== 'cancel').forEach(o => this.aggAdd(o, 1)); }
    S.agg.top3 = S.agg.top3 || {}; S.agg.alltime = S.agg.alltime || {};
    this.save();
  },
  aggAdd(o, sign) {
    for (const k of ['top3', 'alltime']) for (const i of o.items) {
      const a = this.S.agg[k][i.name] || (this.S.agg[k][i.name] = { e: i.emoji, q: 0 });
      a.e = i.emoji || a.e; a.q = Math.max(0, a.q + sign * i.qty);
      if (!a.q) delete this.S.agg[k][i.name];
    }
  },
  sortAgg(m) { return Object.entries(m).map(([n, v]) => ({ n, e: v.e, q: v.q })).sort((a, b) => b.q - a.q || a.n.localeCompare(b.n)); },
  rankList(orders) { const m = {}; orders.forEach(o => o.items.forEach(i => { (m[i.name] = m[i.name] || { e: i.emoji, q: 0 }).q += i.qty; })); return this.sortAgg(m); },
  periodOrders(start, key) { const st = Math.max(start, this.S.resets[key] || 0); return this.S.orders.filter(o => o.ts >= st && o.status !== 'cancel'); },
  rankings() {
    const d = new Date(); d.setHours(0, 0, 0, 0);
    const week = new Date(d); week.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const month = new Date(d.getFullYear(), d.getMonth(), 1);
    return {
      top3: this.sortAgg(this.S.agg.top3).slice(0, 3),
      week: this.rankList(this.periodOrders(+week, 'week')).slice(0, 3),
      month: this.rankList(this.periodOrders(+month, 'month')).slice(0, 3),
      all: this.sortAgg(this.S.agg.alltime).slice(0, 3)
    };
  },
  reviewStats() {
    const by = {};
    for (const r of this.S.reviews) {
      const b = by[r.drinkId] || (by[r.drinkId] = { sum: 0, n: 0, dist: [0, 0, 0, 0, 0], list: [] });
      b.sum += r.stars; b.n++; b.dist[r.stars - 1]++; b.list.push(r);
    }
    for (const b of Object.values(by)) { b.avg = Math.round(b.sum / b.n * 10) / 10; b.list.sort((x, y) => y.ts - x.ts); }
    return by;
  },
  broadcastReviews() {
    const d = {};
    for (const [id, b] of Object.entries(this.reviewStats())) d[id] = { avg: b.avg, n: b.n, dist: b.dist, list: b.list.slice(0, 15).map(r => ({ name: r.name, stars: r.stars, comment: r.comment, ts: r.ts })) };
    this.pub('reviews', { t: 'reviews', d }, true);
  },
  receiveReview(gid, r) {
    if (!r || typeof r.orderId !== 'string') return;
    const o = this.S.orders.find(x => x.id === r.orderId && x.guestId === gid);
    if (!o || (o.status !== 'ready' && o.status !== 'done')) return;
    const it = o.items.find(i => i.id === r.drinkId); if (!it) return;
    const stars = Math.max(1, Math.min(5, parseInt(r.stars) || 0));
    const rev = { id: o.id + ':' + it.id, drinkId: it.id, drink: it.name, emoji: it.emoji, guestId: gid, name: o.name, stars, comment: String(r.comment || '').trim().slice(0, 300), ts: Date.now() };
    const ex = this.S.reviews.find(x => x.id === rev.id);
    if (ex) Object.assign(ex, rev); else this.S.reviews.push(rev);
    if (this.S.reviews.length > 3000) this.S.reviews = this.S.reviews.slice(-3000);
    this.save(); this.broadcastReviews();
    toast(`⭐ ${o.name} hat ${it.name} mit ${stars} ${stars === 1 ? 'Stern' : 'Sternen'} bewertet`);
    if (this.view === 'stats' || this.view === 'menu') safeRender(() => this.renderBody());
  },
  resetStats(keys) {
    const now = Date.now();
    for (const k of keys) {
      this.S.resets[k] = now;
      if (k === 'top3') this.S.agg.top3 = {};
      if (k === 'alltime') this.S.agg.alltime = {};
      if (k === 'reviews') this.S.reviews = [];
    }
    this.confirm = null; this.save(); this.broadcastInfo(); this.broadcastReviews(); this.renderBody();
    toast(keys.length > 1 ? '♻️ Alle Statistiken zurückgesetzt' : '↺ Statistik zurückgesetzt');
  },
  start() { unlockAudio(); keepAwake(); this.started = true; this.connect(); this.render(); },

  /* --- Verbindung über Nachrichten-Server --- */
  topic(x) { return `bk/${this.S.peerId}/${x}`; },
  guestCount() { const cut = Date.now() - 3 * 60e3; let n = 0; for (const t of this.guests.values()) if (t > cut) n++; return n; },
  connect() {
    if (typeof mqtt === 'undefined') { this.status = 'off'; this.renderHeader(); toast('Keine Internetverbindung?'); return; }
    try { this.client && this.client.end(true); } catch {}
    this.status = 'wait'; this.renderHeader(); this._connStart = Date.now(); this._everOn = false;
    const cl = this.client = mqtt.connect(BROKERS[this.S.broker || 0], {
      clientId: 'bkbar-' + this.S.peerId, clean: false, keepalive: 30, reconnectPeriod: 2500, connectTimeout: 10000,
      will: { topic: this.topic('status'), payload: 'offline', retain: true, qos: 1 }
    });
    cl.on('connect', () => {
      if (this.client !== cl) return;
      this.status = 'on'; this._everOn = true; this.renderHeader();
      cl.subscribe(this.topic('in'), { qos: 1 });
      cl.publish(this.topic('status'), 'online', { retain: true, qos: 1 });
      this.broadcastInfo(); this.broadcastOrders(); this.broadcastReviews();
    });
    cl.on('message', (t, msg) => { if (this.client === cl && t === this.topic('in')) { try { this.onData(JSON.parse(msg.toString())); } catch {} } });
    cl.on('reconnect', () => { if (this.client === cl) { this.status = 'wait'; this.renderHeader(); } });
    cl.on('offline', () => { if (this.client === cl) { this.status = 'wait'; this.renderHeader(); } });
    cl.on('error', () => {});
  },
  watchdog() {
    if (!this.started || !this.client) return;
    // Erster Server nicht erreichbar? → Ersatz-Server (QR-Code passt sich an)
    if (!this._everOn && Date.now() - this._connStart > 15000) {
      this.S.broker = ((this.S.broker || 0) + 1) % BROKERS.length; this.save(); this.connect();
      if (this.view === 'qr') this.renderBody();
      return;
    }
    this.renderHeader();
  },
  onData(d) {
    if (!d || typeof d !== 'object' || typeof d.guestId !== 'string') return;
    const gid = d.guestId.replace(/[^a-z0-9-]/gi, '').slice(0, 40); if (!gid) return;
    const isNew = !this.guests.has(gid); this.guests.set(gid, Date.now());
    if (d.t === 'hello') { if (isNew) this.renderHeader(); this.sendOrders(gid); }
    else if (d.t === 'order') this.receiveOrder(gid, d.order);
    else if (d.t === 'review') this.receiveReview(gid, d.review);
    else if (d.t === 'cancel') this.receiveCancel(gid, d.orderId);
  },
  publicInfo() {
    return { t: 'menu', barName: this.S.barName, open: this.S.open, happy: this.S.free ? 0 : this.S.happy, free: !!this.S.free, rank: this.rankings(),
      menu: this.S.menu.map(({id, cat, emoji, name, price, desc, soldOut}) => ({id, cat, emoji, name, price, desc, soldOut})) };
  },
  pub(sub, obj, retain) { try { if (this.client && this.client.connected) this.client.publish(this.topic(sub), JSON.stringify(obj), { qos: 1, retain: !!retain }); } catch {} },
  broadcastInfo() { this.pub('menu', this.publicInfo(), true); },
  queue() { return this.S.orders.filter(o => o.status === 'new' || o.status === 'prep').sort((a, b) => a.ts - b.ts); },
  sendOrders(gid) {
    const q = this.queue(), since = Date.now() - 12 * 3600e3;
    const mine = this.S.orders.filter(o => o.guestId === gid && o.ts > since).map(o => {
      const pos = q.findIndex(x => x.id === o.id);
      return { id: o.id, num: o.num, name: o.name, items: o.items, note: o.note, total: o.total, status: o.status, ts: o.ts, pos: pos >= 0 ? pos : null };
    });
    this.pub('g/' + gid, { t: 'orders', orders: mine }, true);
  },
  broadcastOrders() {
    const since = Date.now() - 12 * 3600e3;
    for (const g of new Set(this.S.orders.filter(o => o.ts > since).map(o => o.guestId))) this.sendOrders(g);
  },
  receiveOrder(gid, o) {
    if (!o || typeof o.id !== 'string') return;
    if (this.S.orders.some(x => x.id === o.id)) { this.sendOrders(gid); return; }
    if ((this.S.gcIds || []).includes(o.id)) return;
    if (!this.S.open) { this.pub('g/' + gid, { t: 'reject', id: o.id, reason: 'Die Bar nimmt gerade keine Bestellungen an.' }); return; }
    const items = [];
    for (const it of (Array.isArray(o.items) ? o.items : []).slice(0, 30)) {
      const m = this.S.menu.find(x => x.id === it.id); const q = Math.max(1, Math.min(20, parseInt(it.qty) || 0));
      if (m && !m.soldOut) items.push({ id: m.id, name: m.name, emoji: m.emoji, qty: q, price: this.S.free ? 0 : discounted(m.price, this.S.happy) });
    }
    if (!items.length) { this.pub('g/' + gid, { t: 'reject', id: o.id, reason: 'Getränk leider nicht mehr verfügbar.' }); return; }
    const day = new Date().toDateString();
    if (this.S.counter.day !== day) this.S.counter = { day, n: 0 };
    this.S.counter.n++;
    const order = {
      id: o.id.slice(0, 40), num: this.S.counter.n, guestId: gid, name: String(o.name || 'Gast').trim().slice(0, 30) || 'Gast',
      note: String(o.note || '').trim().slice(0, 200), items, total: items.reduce((s, i) => s + i.qty * i.price, 0),
      status: 'new', ts: Date.now()
    };
    this.S.orders.push(order); this.aggAdd(order, 1);
    if (this.S.orders.length > 3000) this.S.orders = this.S.orders.slice(-3000);
    this.save(); this.broadcastInfo();
    chime('new'); buzz([200, 80, 200]); toast(`🔔 Neue Bestellung von ${order.name}`); flashTitle(`🔔 Neue Bestellung!`);
    this.broadcastOrders();
    safeRender(() => this.render());
  },
  receiveCancel(gid, id) {
    if (typeof id !== 'string') return;
    const o = this.S.orders.find(x => x.id === id && x.guestId === gid);
    const ack = (ok, reason, final) => this.pub('g/' + gid, { t: 'cancelAck', id, ok, reason, final: !!final });
    if (!o) { if (!this.S.gcIds.includes(id)) { this.S.gcIds.push(id); this.S.gcIds = this.S.gcIds.slice(-500); this.save(); } ack(true); return; }
    if (o.status === 'cancel') { ack(true); this.sendOrders(gid); return; }
    if (o.status === 'new') {
      this.aggAdd(o, -1);
      Object.assign(o, { status: 'cancel', cancelBy: 'guest', cancelTs: Date.now(), alert: 'cancel', alertAck: false });
      this.save(); this.broadcastInfo(); this.broadcastOrders(); ack(true);
      chime('cancel'); buzz([500, 150, 500, 150, 500]); toast(`❌ ${o.name} hat Bestellung #${pad2(o.num)} storniert!`); flashTitle('❌ Bestellung storniert!');
    } else if (o.status === 'prep') {
      if (o.alert !== 'request' || o.alertAck) {
        Object.assign(o, { alert: 'request', alertAck: false, reqTs: Date.now() }); this.save();
        chime('cancel'); buzz([300, 100, 300]); toast(`🙋 ${o.name} möchte #${pad2(o.num)} stornieren`); flashTitle('🙋 Storno-Anfrage!');
      }
      ack(false, 'Dein Drink wird schon gemixt – der Barkeeper wurde informiert.'); this.sendOrders(gid);
    } else {
      ack(false, o.status === 'ready' ? 'Dein Drink ist schon fertig – bitte an der Bar abholen.' : 'Diese Bestellung kann nicht mehr storniert werden.', true); this.sendOrders(gid);
    }
    safeRender(() => this.render());
  },
  alerts() { return this.S.orders.filter(o => o.alert && !o.alertAck).sort((a, b) => (b.cancelTs || b.reqTs || 0) - (a.cancelTs || a.reqTs || 0)); },
  setStatus(id, st) {
    const o = this.S.orders.find(x => x.id === id); if (!o) return;
    if (st === 'cancel' && o.status !== 'cancel') { this.aggAdd(o, -1); setTimeout(() => this.broadcastInfo(), 0); }
    if (st !== 'cancel' && o.alert === 'request' && !o.alertAck) { o.alertAck = true; this.pub('g/' + o.guestId, { t: 'cancelAck', id: o.id, ok: false, reason: 'Storno abgelehnt – dein Drink kommt trotzdem 🍹', final: true }); }
    o.status = st; if (st === 'ready') o.readyTs = Date.now(); if (st === 'prep') o.prepTs = Date.now();
    this.confirm = null; this.save(); this.broadcastOrders(); this.render();
    if (st === 'ready') toast(`✅ ${o.name} wurde benachrichtigt`);
  },

  /* --- Ansichten --- */

  },

  v_orders() {
    const O = this.S.orders, f = this.filter;
    const groups = { open: O.filter(o => o.status === 'new' || o.status === 'prep'), ready: O.filter(o => o.status === 'ready'), done: O.filter(o => o.status === 'done' || o.status === 'cancel') };
    let list = groups[f]; list = f === 'open' ? list.sort((a, b) => a.ts - b.ts) : list.sort((a, b) => b.ts - a.ts).slice(0, 60);

    const banner = this.alerts().map(o => `<div class="alert ${o.alert}"><div class="aic">${o.alert === 'cancel' ? '❌' : '🙋'}</div><div class="flex1"><div style="font-weight:800">${o.alert === 'cancel' ? 'Vom Gast storniert!' : 'Storno-Anfrage – wird schon gemixt'}</div><div style="font-size:14px">#${pad2(o.num)} ${esc(o.name)} · ${o.items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div><div class="muted" style="font-size:12px">${ago(o.cancelTs || o.reqTs)}${o.alert === 'cancel' ? ' · nicht mehr zubereiten' : ''}</div></div><div class="abtns">${o.alert === 'request' ? `<button class="btn sm danger" data-a="reqCancel" data-id="${o.id}">Stornieren</button><button class="btn sm" data-a="ackAlert" data-id="${o.id}">Ablehnen</button>` : `<button class="btn sm" data-a="ackAlert" data-id="${o.id}">OK 👍</button>`}</div></div>`).join('');

  orderCard(o) {

  v_stats() {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const T = k => this.periodOrders(+d0, k);
    const rev = T('rev').reduce((s, o) => s + o.total, 0);
    const drinks = T('drinks').reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0);
    const waits = T('wait').filter(o => o.readyTs).map(o => (o.readyTs - o.ts) / 60000);
    const avg = waits.length ? Math.round(waits.reduce((a, b) => a + b, 0) / waits.length * 10) / 10 : null;
    const guests = new Set(T('guests').map(o => o.name.toLowerCase())).size;
    const hours = Array(24).fill(0), P = T('peak'); P.forEach(o => hours[new Date(o.ts).getHours()]++);

    const rk = this.rankings(), rs = this.reviewStats();

    const tile = (k, label, val, hl) => `<div class="stat ${hl ? 'hl' : ''}">${rsBtn(k)}<div class="k">${label}</div><div class="v">${val}</div></div>`;
    const sh = (title, k) => `<div class="sh"><span>${title}</span>${k ? rsBtn(k) : ''}</div>`;

      ? `<div class="pe">${esc(list[0].e || '🍹')}</div><div class="nm">${esc(list[0].n)}</div><div class="q">${list[0].q}× bestellt</div>${list.slice(1).map((x, i) => `<div class="sub">${i + 2}. ${esc(x.n)} · ${x.q}×</div>`).join('')}`
      : '<div class="q" style="margin-top:14px">Noch keine Daten</div>'}</div>`;
    const all = this.S.reviews, tot = all.length, oavg = tot ? Math.round(all.reduce((s, r) => s + r.stars, 0) / tot * 10) / 10 : null;
    const rows = Object.entries(rs).sort((a, b) => b[1].avg - a[1].avg || b[1].n - a[1].n).map(([id, b]) => {
      const m = this.S.menu.find(x => x.id === id), nm = m ? m.name : b.list[0].drink, em = m ? m.emoji : b.list[0].emoji;
      return `<div class="revrow"><div style="font-size:26px">${esc(em || '🍹')}</div><div class="flex1"><div style="font-weight:700">${esc(nm)}</div><div class="rt"><span class="stars">${starStr(b.avg)}</span> <b>${b.avg.toFixed(1)}</b> <span class="muted">(${b.n} ${b.n === 1 ? 'Bewertung' : 'Bewertungen'})</span></div></div></div>`;
    }).join('');
    const comments = [...all].sort((a, b) => b.ts - a.ts).slice(0, 40);
    return `<div class="h2">Statistik</div>
      ${sh('📆 Heute')}
      <div class="stats">
        ${tile('rev', 'Umsatz', this.S.free && rev === 0 ? '🎁 Gratis' : eur(rev), true)}
        ${tile('orders', 'Bestellungen', T('orders').length)}
        ${tile('drinks', 'Drinks', drinks)}

        ${tile('wait', 'Ø Wartezeit', avg !== null ? avg + ' min' : '–')}

      ${sh('📊 Heute im Detail', 'today')}
      <div class="card">${today.length ? today.map((v, i) => `<div class="bar-row"><div class="lbl">${i === 0 ? '👑 ' : ''}${esc(v.e || '')} ${esc(v.n)}</div><div class="trk"><div class="fil" style="width:${v.q / max * 100}%"></div></div><div class="cnt">${v.q}</div></div>`).join('') : '<div class="muted" style="text-align:center;padding:14px">Noch keine Bestellungen heute.</div>'}</div>
      ${sh('⭐ Bewertungen', 'reviews')}
      <div class="card">

        ${rows || '<div class="muted" style="text-align:center;padding:8px">Gäste können ihre Drinks bewerten, sobald sie fertig sind.</div>'}
      </div>
      ${comments.length ? `${sh('💬 Gästekommentare')}<div class="card" style="padding-top:4px;padding-bottom:4px">${comments.map(r => `<div class="rv"><div class="row"><span style="font-size:20px">${esc(r.emoji || '🍹')}</span><b>${esc(r.name)}</b><span class="stars">${starStr(r.stars)}</span><button class="btn sm danger" style="margin-left:auto;padding:4px 9px" data-a="delReview" data-id="${esc(r.id)}">${this.confirm === 'dr:' + r.id ? 'Löschen?' : '✕'}</button></div><div class="muted" style="font-size:12.5px;margin-top:2px">${esc(r.drink)} · ${ago(r.ts)}</div>${r.comment ? `<div class="rvc">${esc(r.comment)}</div>` : ''}</div>`).join('')}</div>` : ''}
      <button class="btn danger block" style="margin-top:28px" data-a="resetAllStats">${this.confirm === 'rs:ALL' ? '⚠️ Wirklich ALLE Statistiken zurücksetzen?' : '♻️ Alle Statistiken zurücksetzen'}</button>

  },

          <div class="row"><button class="btn ghost" style="flex:1" data-a="importCancel">Abbrechen</button><button class="btn pri" style="flex:1" data-a="importApply">📂 Jetzt laden</button></div>`
        : `<button class="btn pri" data-a="exportBackup">💾 Backup speichern</button>
        <label class="btn" style="cursor:pointer">📂 Backup laden<input type="file" accept=".json,application/json" data-c="import" style="display:none"></label>`}
      </div>
      <div class="cat-h">Aufräumen</div>
      <div class="card" style="display:grid;gap:10px">
        <button class="btn" data-a="clearDone">🧹 Erledigte Bestellungen löschen</button>
        <button class="btn" data-a="newCode">🔄 Neuen QR-Code erzeugen</button>
        <button class="btn danger" data-a="resetAll">${this.resetAsk ? '⚠️ Wirklich alles zurücksetzen?' : '♻️ Alles zurücksetzen'}</button>
      </div>
      <div class="hint" style="text-align:center;margin-top:18px">Alle Daten bleiben auf diesem Gerät gespeichert.<br>Ein neuer QR-Code macht alte Codes ungültig.</div>`;
  },

  act(a, ds) {
    if (!['cancel', 'del', 'resetStat', 'resetAllStats', 'delReview'].includes(a)) this.confirm = null;
    if (a === 'ackAlert' || a === 'reqCancel') {
      const o = this.S.orders.find(x => x.id === ds.id); if (!o) return;
      if (a === 'reqCancel') { o.alertAck = true; o.cancelBy = 'guest'; o.cancelTs = Date.now(); this.setStatus(o.id, 'cancel'); toast(`#${pad2(o.num)} storniert`); return; }
      if (o.alert === 'request') this.pub('g/' + o.guestId, { t: 'cancelAck', id: o.id, ok: false, reason: 'Storno abgelehnt – dein Drink kommt trotzdem 🍹', final: true });
      o.alertAck = true; this.save(); this.renderBody(); return;
    }
    if (a !== 'resetAll') this.resetAsk = false;
    switch (a) {
      case 'start': this.start(); break;
      case 'view': this.view = ds.v; this.formOpen = false; this.render(); window.scrollTo(0, 0); break;
      case 'filter': this.filter = ds.v; this.renderBody(); break;
      case 'st': this.setStatus(ds.id, ds.st); break;
      case 'cancel':
        if (this.confirm === ds.id) this.setStatus(ds.id, 'cancel'); else { this.confirm = ds.id; this.renderBody(); } break;
      case 'formToggle': this.formOpen = !this.formOpen; this.renderBody(); if (this.formOpen) setTimeout(() => document.getElementById('f-name')?.focus(), 50); break;
      case 'emoji': this.newEmoji = ds.v; document.querySelectorAll('.emojis button').forEach(b => b.classList.toggle('on', b.dataset.v === ds.v)); break;
      case 'addDrink': {
        const name = document.getElementById('f-name').value.trim();
        const pv = document.getElementById('f-price').value.trim(); const price = pv === '' ? 0 : parseFloat(pv.replace(',', '.'));
        const cat = document.getElementById('f-cat').value.trim() || 'Sonstiges';
        const desc = document.getElementById('f-desc').value.trim();
        if (!name) { toast('Bitte einen Namen eingeben'); return; }
        if (!(price >= 0) || price > 999) { toast('Bitte einen gültigen Preis eingeben'); return; }
        this.S.menu.push({ id: 'd-' + uid(6), cat, emoji: this.newEmoji, name, price: Math.round(price * 100) / 100, desc, soldOut: false });
        this.save(); this.broadcastInfo(); this.formOpen = false; this.renderBody(); toast(`${this.newEmoji} ${name} hinzugefügt`); break;
      }
      case 'soldout': { const m = this.S.menu.find(x => x.id === ds.id); if (m) { m.soldOut = !m.soldOut; this.save(); this.broadcastInfo(); this.renderBody(); } break; }
      case 'del':
        if (this.confirm === ds.id) { const m = this.S.menu.find(x => x.id === ds.id); this.S.menu = this.S.menu.filter(x => x.id !== ds.id); this.confirm = null; this.save(); this.broadcastInfo(); this.renderBody(); toast(`${m ? m.name : 'Getränk'} gelöscht`); }
        else { this.confirm = ds.id; this.renderBody(); } break;
      case 'resetStat':
        if (this.confirm !== 'rs:' + ds.k) { this.confirm = 'rs:' + ds.k; this.renderBody(); break; }
        this.resetStats([ds.k]); break;
      case 'resetAllStats':
        if (this.confirm !== 'rs:ALL') { this.confirm = 'rs:ALL'; this.renderBody(); break; }
        this.resetStats(STAT_KEYS); break;
      case 'delReview':
        if (this.confirm !== 'dr:' + ds.id) { this.confirm = 'dr:' + ds.id; this.renderBody(); break; }
        this.S.reviews = this.S.reviews.filter(r => r.id !== ds.id); this.confirm = null; this.save(); this.broadcastReviews(); this.renderBody(); toast('Bewertung gelöscht'); break;
      case 'copy': copyText(this.guestUrl()); break;
      case 'fullqr': this.full = true; this.render(); try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {} break;
      case 'closefull': this.full = false; this.render(); try { document.fullscreenElement && document.exitFullscreen(); } catch {} break;
      case 'toggleOpen': this.S.open = !this.S.open; this.save(); this.broadcastInfo(); this.render(); toast(this.S.open ? '✅ Bestellungen wieder offen' : '⛔ Bestellungen pausiert'); break;
      case 'toggleFree': this.S.free = !this.S.free; this.save(); this.broadcastInfo(); this.render(); toast(this.S.free ? '🎁 Alles kostenlos – Preise ausgeblendet' : '💶 Preise wieder sichtbar'); break;
      case 'exportBackup': {
        const data = { app: 'barkeeper', version: 1, savedAt: Date.now(), data: this.S };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `barkeeper-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        toast('💾 Backup gespeichert'); break;
      }
      case 'importCancel': this.importData = null; this.renderBody(); break;
      case 'importApply': {
        const d = this.importData.data, def = this.defaults();
        this.S = { ...def, ...d, peerId: this.S.peerId, counter: d.counter || def.counter, orders: Array.isArray(d.orders) ? d.orders : [] };
        this.importData = null; this.migrate(); this.broadcastInfo(); this.broadcastOrders(); this.broadcastReviews(); this.render(); toast('📂 Backup geladen ✓'); break;
      }
      case 'happy': this.S.happy = +ds.v; this.save(); this.broadcastInfo(); this.render(); toast(this.S.happy ? `🎉 Happy Hour −${this.S.happy}% aktiv` : 'Happy Hour beendet'); break;
      case 'clearDone': { const n = this.S.orders.length; this.S.orders = this.S.orders.filter(o => o.status !== 'done' && o.status !== 'cancel'); this.save(); this.broadcastOrders(); this.render(); toast(`${n - this.S.orders.length} Bestellungen gelöscht`); break; }
      case 'newCode': this.S.peerId = 'bk-' + uid(12); this.save(); try { this.client && this.client.publish(this.topic('status'), 'offline', { retain: true, qos: 1 }); } catch {} this.guests.clear(); setTimeout(() => this.connect(), 300); this.view = 'qr'; this.render(); toast('Neuer QR-Code erstellt'); break;
      case 'resetAll':
        if (!this.resetAsk) { this.resetAsk = true; this.renderBody(); break; }
        { const id = this.S.peerId; this.S = this.defaults(); this.S.peerId = id; this.save(); this.broadcastInfo(); this.broadcastOrders(); this.broadcastReviews(); this.render(); toast('Zurückgesetzt'); } break;
    }
  },
  change(key, el) {
    if (key === 'import') {
      const f = el.files && el.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const j = JSON.parse(r.result);
          if (!j || j.app !== 'barkeeper' || !j.data || !Array.isArray(j.data.menu)) throw 0;
          j.data.menu = j.data.menu.filter(m => m && m.name).map(m => ({ id: String(m.id || 'd-' + uid(6)), cat: String(m.cat || 'Sonstiges'), emoji: String(m.emoji || '🍹'), name: String(m.name).slice(0, 40), price: Math.max(0, +m.price || 0), desc: String(m.desc || '').slice(0, 70), soldOut: !!m.soldOut }));
          this.importData = j; this.renderBody();
        } catch { toast('⚠️ Das ist keine gültige Backup-Datei'); }
      };
      r.readAsText(f); return;
    }
    if (key === 'barName') { this.S.barName = el.value.trim().slice(0, 32) || 'Meine Bar'; this.save(); this.broadcastInfo(); this.renderHeader(); toast('Name gespeichert'); }
  }
};

/* ================================================================
   GAST
   ================================================================ */
const Guest = {
  barId: null, broker: 0, G: null, info: null, client: null, connected: false, barAway: false,
  view: 'menu', cat: 'Alle', cart: {}, note: '', cartOpen: false, editName: false, ready: null, reviews: {}, rv: null, detail: null, cconfirm: null,

  init(barId) {
    this.barId = barId.replace(/[^a-z0-9-]/gi, '').slice(0, 40);
    this.broker = Math.min(BROKERS.length - 1, Math.max(0, parseInt(new URLSearchParams(location.hash.slice(1)).get('b')) || 0));
    this.G = store.get('bk_guest_' + this.barId, null) || { name: '', guestId: 'g-' + uid(12), orders: {} };
    this.info = store.get('bk_info_' + this.barId, null);
    this.reviews = store.get('bk_rev_' + this.barId, {}) || {};
    if (!this.G.rated) this.G.rated = {};
    if (!this.G.pendingCancel) this.G.pendingCancel = {};
    if (!this.G.cancelReq) this.G.cancelReq = {};
    if (Object.values(this.G.orders).some(o => ['new', 'prep', 'ready', 'sending'].includes(o.status))) this.view = 'orders';
    this.render(); this.connect();
    setInterval(() => this.watchdog(), 4000);
  },
  save() { store.set('bk_guest_' + this.barId, this.G); },

  connect() {
    if (typeof mqtt === 'undefined') { this.barAway = true; this.render(); return; }
    const T = x => `bk/${this.barId}/${x}`;
    const cl = this.client = mqtt.connect(BROKERS[this.broker], { clientId: 'bkg-' + uid(12), clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 10000 });
    cl.on('connect', () => {
      this.connected = true;
      cl.subscribe([T('menu'), T('status'), T('reviews'), T('g/' + this.G.guestId)], { qos: 1 });
      this.hello(); this.resend();
      safeRender(() => this.render());
    });
    cl.on('message', (t, msg) => {
      const s = msg.toString();
      if (t === T('status')) { this.barAway = s !== 'online'; safeRender(() => this.render()); return; }
      try { this.onData(JSON.parse(s)); } catch {}
    });
    cl.on('offline', () => { this.connected = false; safeRender(() => this.render()); });
    cl.on('close', () => { if (this.connected) { this.connected = false; safeRender(() => this.render()); } });
    cl.on('error', () => {});
  },
  pub(obj) { try { if (this.client && this.client.connected) this.client.publish(`bk/${this.barId}/in`, JSON.stringify(obj), { qos: 1 }); } catch {} },
  hello() { this.pub({ t: 'hello', guestId: this.G.guestId }); },
  resend() {
    Object.values(this.G.orders).filter(o => o.status === 'sending').forEach(o => this.transmit(o));
    for (const [id, ts] of Object.entries(this.G.pendingCancel)) { if (Date.now() - ts > 15 * 60e3) delete this.G.pendingCancel[id]; else this.sendCancel(id); }
  },
  sendCancel(id) { this.pub({ t: 'cancel', guestId: this.G.guestId, orderId: id }); },
  watchdog() {
    if (!this.connected) return;
    this._tick = (this._tick || 0) + 1;
    if (this._tick % 2 === 0) this.resend();      // unbestätigte Bestellungen erneut senden
    if (this._tick % 15 === 0) this.hello();      // „bin noch da“ für den Gäste-Zähler
  },
  onData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'menu') {
      this.info = { barName: d.barName, open: d.open, happy: d.happy, free: !!d.free, rank: d.rank || null, menu: d.menu || [] };
      store.set('bk_info_' + this.barId, this.info);
      for (const id of Object.keys(this.cart)) { const m = this.info.menu.find(x => x.id === id); if (!m || m.soldOut) delete this.cart[id]; }
      document.title = baseTitle = (d.barName || 'Bar') + ' – Bestellen';
      safeRender(() => this.render());
    } else if (d.t === 'orders') {
      const incoming = d.orders || [];
      for (let o of incoming) {
        if (this.G.pendingCancel[o.id] && o.status === 'new') o = { ...o, status: 'cancel' };
        const old = this.G.orders[o.id];
        if (old && old.status !== 'ready' && o.status === 'ready') this.celebrate(o);
        if (old && old.status !== 'cancel' && o.status === 'cancel') { toast('❌ Deine Bestellung wurde storniert'); buzz(300); }
        if (old && old.status === 'sending') { toast(`✅ Bestellung #${o.num} ist angekommen`); }
        this.G.orders[o.id] = o;
      }
      // Alte Einträge aufräumen
      const cut = Date.now() - 24 * 3600e3;
      for (const [k, o] of Object.entries(this.G.orders)) if (o.ts < cut) delete this.G.orders[k];
      this.save(); safeRender(() => this.render());
    } else if (d.t === 'cancelAck') {
      delete this.G.pendingCancel[d.id];
      if (!d.ok && d.final) this.G.cancelReq[d.id] = 'rejected';
      if (!d.ok && d.reason) toast('ℹ️ ' + d.reason);
      this.save(); safeRender(() => this.render());
    } else if (d.t === 'reviews') {
      this.reviews = d.d || {}; store.set('bk_rev_' + this.barId, this.reviews); safeRender(() => this.render());
    } else if (d.t === 'reject') {
      delete this.G.orders[d.id]; this.save(); toast('⚠️ ' + (d.reason || 'Bestellung abgelehnt')); this.render();
    }
  },
  transmit(o) { this.pub({ t: 'order', guestId: this.G.guestId, order: { id: o.id, name: o.name, note: o.note, items: o.items.map(i => ({ id: i.id, qty: i.qty })) } }); },
  celebrate(o) {
    this.ready = o; chime('ready'); buzz([400, 120, 400, 120, 700]); flashTitle('🍹 Dein Drink ist fertig!'); confetti();
  },
  cartItems() {
    if (!this.info) return [];
    return Object.entries(this.cart).map(([id, qty]) => { const m = this.info.menu.find(x => x.id === id); return m ? { ...m, qty, p: this.info.free ? 0 : discounted(m.price, this.info.happy) } : null; }).filter(Boolean);
  },
  placeOrder() {
    const items = this.cartItems(); if (!items.length) return;
    unlockAudio();
    const o = { id: 'o-' + uid(12), name: this.G.name, note: this.note.trim().slice(0, 200), status: 'sending', ts: Date.now(), num: null,
      items: items.map(i => ({ id: i.id, name: i.name, emoji: i.emoji, qty: i.qty, price: i.p })), total: items.reduce((s, i) => s + i.qty * i.p, 0) };
    this.G.orders[o.id] = o; this.save();
    this.transmit(o);
    this.cart = {}; this.note = ''; this.cartOpen = false; this.view = 'orders';
    buzz(60); this.render(); window.scrollTo(0, 0);
    if (!this.connected) toast('Wird gesendet, sobald die Verbindung steht…');
  },

  render() {
    const I = this.info;
    if (!this.G.name || this.editName) { app.innerHTML = this.welcome(); return; }
    const dot = this.connected && !this.barAway ? '<span class="dot on"></span>' : this.barAway ? '<span class="dot off"></span>' : '<span class="dot wait"></span>';
    const active = Object.values(this.G.orders).filter(o => ['sending', 'new', 'prep', 'ready'].includes(o.status)).length;
    let main;
    if (!I) main = `<div class="empty"><div class="spin"></div><div style="font-size:18px;font-weight:700;color:var(--txt)">Verbinde mit der Bar…</div>${this.connected ? '<div class="sec">Verbunden – warte auf die Bar.<br>Ist die Barkeeper-App geöffnet und auf „Bar öffnen“ getippt?</div>' : ''}</div>`;
    else main = (this.view === 'menu' ? this.menuView() : this.ordersView());
    const cnt = Object.values(this.cart).reduce((a, b) => a + b, 0);
    const tot = this.cartItems().reduce((s, i) => s + i.qty * i.p, 0);
    app.innerHTML = `<div class="shell">
      <header class="top"><div class="logo">🍸</div><div class="ttl"><h1>${esc(I ? I.barName : 'Bar')}</h1><small>${!this.connected ? 'Verbinde…' : this.barAway ? 'Bar gerade offline' : 'Live verbunden'}</small></div>${dot}<button class="namechip" data-a="editName">👤 ${esc(this.G.name)}</button></header>
      <main>
        ${I && this.connected && this.barAway ? `<div class="banner cl">📴 Die Bar ist gerade offline – deine Bestellung wird gesendet, sobald sie wieder da ist.</div>` : ''}
        ${I && !I.open ? `<div class="banner cl">⛔ Die Bar nimmt gerade keine Bestellungen an.</div>` : ''}
        ${I && I.open && I.free ? `<div class="banner hh">🎁 Heute geht alles aufs Haus – bestell, was du magst!</div>` : I && I.open && I.happy ? `<div class="banner hh">🎉 Happy Hour! Alles −${I.happy}%</div>` : ''}
        ${I ? `<div class="seg"><button class="${this.view === 'menu' ? 'on' : ''}" data-a="gview" data-v="menu">🍹 Karte</button><button class="${this.view === 'orders' ? 'on' : ''}" data-a="gview" data-v="orders">🧾 Bestellungen${active ? `<span class="bdg">${active}</span>` : ''}</button></div>` : ''}
        ${main}
      </main>
      ${I && this.view === 'menu' && cnt && !this.cartOpen ? `<div class="cartbar"><div><b>${cnt} ${cnt === 1 ? 'Drink' : 'Drinks'}</b><div style="font-size:14px;opacity:.9">${I.free ? '🎁 gratis' : eur(tot)}</div></div><button class="btn" data-a="openCart">Warenkorb →</button></div>` : ''}
      ${this.cartOpen ? this.cartSheet() : ''}${this.detail ? this.detailSheet() : ''}${this.rv ? this.rateSheet() : ''}
    </div>${this.ready ? this.readyOverlay() : ''}`;
  },
  welcome() {
    const I = this.info;
    return `<div class="splash">
      <div class="logo">🍹</div>
      <div class="muted" style="font-weight:600">Willkommen ${I ? 'in der' : 'in der Bar'}</div>
      <h1 style="font-size:38px;margin:0">${I ? `<span class="gradtxt">${esc(I.barName)}</span>` : '<span class="gradtxt">Bar</span>'}</h1>
      <div class="muted" style="max-width:320px">Wie heißt du? Damit weiß der Barkeeper, wem der Drink gehört.</div>
      <form data-f="name" style="width:100%;max-width:340px;display:grid;gap:12px;margin-top:6px">
        <input class="in" id="g-name" maxlength="30" autocomplete="given-name" placeholder="Dein Name" value="${esc(this.G.name)}" style="text-align:center;font-size:19px;padding:16px">
        <button class="btn pri lg block" type="submit">Los geht's 🚀</button>
      </form>
    </div>`;
  },
  menuView() {
    const I = this.info, cats = ['Alle', ...new Set(I.menu.map(m => m.cat))];
    if (!cats.includes(this.cat)) this.cat = 'Alle';
    const list = I.menu.filter(m => this.cat === 'Alle' || m.cat === this.cat);
    if (!I.menu.length) return `<div class="empty"><div class="big">🫗</div>Die Karte ist noch leer.</div>`;
    const rk = I.rank || {}, top = (rk.top3 || []).map(x => x.n), byName = n => (I.menu.find(m => m.name === n) || {}).id;
    const card = m => {
      const q = this.cart[m.id] || 0, p = discounted(m.price, I.happy), rv = this.reviews[m.id], tp = top.indexOf(m.name);
      return `<div class="drink ${q ? 'has' : ''} ${m.soldOut ? 'so' : ''}">
        <div class="em tap" data-a="drinkInfo" data-id="${m.id}">${esc(m.emoji)}</div>
        <div class="flex1 tap" data-a="drinkInfo" data-id="${m.id}"><div class="nm">${esc(m.name)}${tp >= 0 ? `<span class="bs">${MEDALS[tp]} Top ${tp + 1}</span>` : ''}</div>${m.desc ? `<div class="ds">${esc(m.desc)}</div>` : ''}${rv ? `<div class="rt"><span class="stars">${starStr(rv.avg)}</span> <b>${rv.avg.toFixed(1)}</b> <span class="muted">(${rv.n})</span></div>` : ''}${I.free ? '' : `<div class="pr">${I.happy ? `<s>${eur(m.price)}</s>` : ''}${eur(p)}</div>`}</div>
        ${m.soldOut ? '<span class="tag cancel">Aus</span>' : `<div class="qty">${q ? `<button data-a="dec" data-id="${m.id}">−</button><span>${q}</span>` : ''}<button class="add" data-a="inc" data-id="${m.id}" ${!I.open ? 'disabled' : ''}>＋</button></div>`}
      </div>`;
    };
    const body = this.cat === 'Alle'
      ? cats.slice(1).map(c => `<div class="cat-h">${esc(c)}</div><div class="drinks">${I.menu.filter(m => m.cat === c).map(card).join('')}</div>`).join('')
      : `<div class="drinks">${list.map(card).join('')}</div>`;
    const pops = [['📅', 'Woche', rk.week], ['🗓️', 'Monat', rk.month], ['♾️', 'Allzeit', rk.all]];
    const hl = this.cat === 'Alle' && rk.top3 && rk.top3.length ? `<div class="cat-h" style="margin-top:6px">🏆 Top 3 – meistverkauft</div>
      ${podiumHtml(rk.top3, x => byName(x.n) ? `data-a="drinkInfo" data-id="${byName(x.n)}"` : '')}
      <div class="cat-h">🔥 Am beliebtesten</div>
      <div class="ranks">${pops.map(([ic, l, li]) => `<div class="rcard mini" ${li && li[0] && byName(li[0].n) ? `data-a="drinkInfo" data-id="${byName(li[0].n)}" style="cursor:pointer"` : ''}><div class="k">${ic} ${l}</div>${li && li[0] ? `<div class="pe">${esc(li[0].e || '🍹')}</div><div class="nm">${esc(li[0].n)}</div><div class="q">${li[0].q}× bestellt</div>` : '<div class="q" style="margin-top:10px">–</div>'}</div>`).join('')}</div>` : '';
    return `<div class="chips">${cats.map(c => `<button class="chip ${this.cat === c ? 'on' : ''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>${hl}${body}`;
  },
  ordersView() {
    const list = Object.values(this.G.orders).sort((a, b) => b.ts - a.ts);
    if (!list.length) return `<div class="empty"><div class="big">🧾</div><div style="font-size:18px;font-weight:700;color:var(--txt)">Noch nichts bestellt</div><div>Such dir was Leckeres aus!</div><button class="btn pri sec" data-a="gview" data-v="menu">🍹 Zur Karte</button></div>`;
    return `<div style="display:grid;gap:12px">${list.map(o => {
      const lvl = { sending: 0, new: 1, prep: 2, ready: 3, done: 3, cancel: 0 }[o.status];
      const tagc = { sending: '', new: 'new', prep: 'prep', ready: 'ready', done: '', cancel: 'cancel' }[o.status];
      const canRate = o.status === 'ready' || o.status === 'done';
      const req = this.G.cancelReq[o.id], cc = this.cconfirm === o.id;
      let foot = '';
      if (o.status === 'new' || o.status === 'sending') foot = `<button class="btn sm danger" data-a="gcancel" data-id="${o.id}">${cc ? '⚠️ Wirklich stornieren?' : '✕ Stornieren'}</button>`;
      else if (o.status === 'prep') foot = req === true ? '<span class="muted" style="font-size:13px">🙋 Storno angefragt – der Barkeeper entscheidet</span>' : req === 'rejected' ? '<span class="muted" style="font-size:13px">Storno abgelehnt – dein Drink kommt trotzdem 🍹</span>' : `<button class="btn sm danger" data-a="gcancel" data-id="${o.id}">${cc ? '⚠️ Wirklich anfragen?' : '✕ Stornieren anfragen'}</button>`;
      let info = '';
      if (o.status === 'sending') info = this.connected ? 'Wird übermittelt…' : '📡 Warte auf Verbindung zur Bar…';
      else if ((o.status === 'new' || o.status === 'prep') && o.pos !== null && o.pos !== undefined) info = o.pos === 0 ? '🔥 Du bist als Nächstes dran!' : `⏳ Noch ${o.pos} ${o.pos === 1 ? 'Bestellung' : 'Bestellungen'} vor dir · ca. ${Math.max(2, o.pos * 2 + 2)} Min`;
      else if (o.status === 'ready') info = '🎉 Hol dir deinen Drink an der Bar ab!';
      return `<div class="order gorder ${o.status === 'ready' ? 'ready' : ''} st-${o.status === 'sending' ? 'new' : o.status}">
        <div class="o-top"><div class="o-num">${o.num ? '#' + String(o.num).padStart(2, '0') : '…'}</div><div class="flex1"><div class="o-name">${STATUS[o.status]}</div><div class="o-time">${hhmm(o.ts)} · ${o.total > 0 ? eur(o.total) : '🎁 Gratis'}</div></div><span class="tag ${tagc}">${o.status === 'ready' ? '🍹' : o.status === 'prep' ? '🍸' : o.status === 'done' ? '✓' : o.status === 'cancel' ? '✕' : '•'}</span></div>
        ${o.status !== 'cancel' && o.status !== 'done' ? `<div class="track"><div class="${lvl >= 1 ? 'on' : ''}"></div><div class="${lvl >= 2 ? 'on' : ''}"></div><div class="${lvl >= 3 ? 'ok' : ''}"></div></div>
        <div class="steps"><span class="${lvl >= 1 ? 'on' : ''}">Eingegangen</span><span class="${lvl >= 2 ? 'on' : ''}">Wird gemixt</span><span class="${lvl >= 3 ? 'on' : ''}">Fertig</span></div>` : ''}
        <ul class="o-items">${o.items.map(i => { const r = this.G.rated[o.id + ':' + i.id]; return `<li><span class="q">${i.qty}×</span><span>${esc(i.emoji || '')} ${esc(i.name)}</span>${canRate ? `<button class="ratebtn ${r ? 'done' : ''}" data-a="rate" data-o="${o.id}" data-id="${i.id}">${r ? `<span class="stars">${starStr(r.stars)}</span>` : '⭐ Bewerten'}</button>` : ''}</li>`; }).join('')}</ul>
        ${o.note ? `<div class="o-note">📝 ${esc(o.note)}</div>` : ''}
        ${info ? `<div class="sec" style="font-weight:600">${info}</div>` : ''}
        ${foot ? `<div class="gfoot">${foot}</div>` : ''}
      </div>`;
    }).join('')}</div>`;
  },
  cartSheet() {
    const items = this.cartItems(), tot = items.reduce((s, i) => s + i.qty * i.p, 0);
    return `<div class="sheet-bg" data-a="closeCart"></div><div class="sheet">
      <div class="grab"></div>
      <div class="h2" style="margin-top:0">Deine Bestellung</div>
      ${items.map(i => `<div class="line"><div style="font-size:28px">${esc(i.emoji)}</div><div class="flex1"><div style="font-weight:700">${esc(i.name)}</div><div class="muted" style="font-size:13px">${this.info.free ? 'gratis' : eur(i.p)}</div></div><div class="qty"><button data-a="dec" data-id="${i.id}">−</button><span>${i.qty}</span><button class="add" data-a="inc" data-id="${i.id}">＋</button></div></div>`).join('')}
      <div class="sec"><label class="lb">Sonderwunsch? (optional)</label><textarea class="in" id="g-note" rows="2" maxlength="200" placeholder="z. B. ohne Eis, extra Limette…">${esc(this.note)}</textarea></div>
      <div class="sum"><span>Gesamt</span><span>${this.info.free ? '🎁 Gratis' : eur(tot)}</span></div>
      <div class="hint" style="margin:-8px 2px 14px">${this.info.free ? 'Geht aufs Haus 🥂' : 'Bezahlt wird beim Abholen an der Bar'} · Bestellung auf den Namen <b>${esc(this.G.name)}</b></div>
      <button class="btn pri lg block" data-a="order" ${!items.length || !this.info.open ? 'disabled' : ''}>🍹 Jetzt bestellen</button>
    </div>`;
  },
  detailSheet() {
    const I = this.info, m = I && I.menu.find(x => x.id === this.detail); if (!m) return '';
    const rv = this.reviews[m.id], q = this.cart[m.id] || 0, com = rv ? rv.list.filter(x => x.comment) : [];
    return `<div class="sheet-bg" data-a="closeDetail"></div><div class="sheet">
      <div class="grab"></div><button class="xbtn" data-a="closeDetail" aria-label="Schließen">✕</button>
      <div class="dhead"><div class="dem">${esc(m.emoji)}</div><div class="flex1"><div class="h2" style="margin:0">${esc(m.name)}</div>${m.desc ? `<div class="muted">${esc(m.desc)}</div>` : ''}${I.free ? '' : `<div style="font-weight:800;margin-top:6px">${eur(discounted(m.price, I.happy))}</div>`}</div></div>
      ${rv ? `<div class="rsum"><div class="big">${rv.avg.toFixed(1)}</div><div><div class="stars lg">${starStr(rv.avg)}</div><div class="muted">${rv.n} ${rv.n === 1 ? 'Bewertung' : 'Bewertungen'}</div></div></div>
        ${[5, 4, 3, 2, 1].map(st => `<div class="bar-row"><div class="lbl" style="width:42px">${st} ★</div><div class="trk"><div class="fil" style="width:${rv.dist[st - 1] / rv.n * 100}%"></div></div><div class="cnt">${rv.dist[st - 1]}</div></div>`).join('')}
        <div class="cat-h">💬 Kommentare</div>
        ${com.length ? com.map(x => `<div class="rv"><div class="row"><b>${esc(x.name)}</b><span class="stars">${starStr(x.stars)}</span><span class="muted" style="margin-left:auto;font-size:12px">${ago(x.ts)}</span></div><div class="rvc">${esc(x.comment)}</div></div>`).join('') : '<div class="muted">Noch keine Kommentare.</div>'}`
      : `<div class="empty" style="padding:24px 10px"><div class="big" style="font-size:40px">⭐</div>Noch keine Bewertungen – probier ihn und sei der Erste!</div>`}
      ${m.soldOut || !I.open ? '' : `<button class="btn pri lg block sec" data-a="inc" data-id="${m.id}">＋ In den Warenkorb${q ? ` (${q})` : ''}</button>`}
    </div>`;
  },
  rateSheet() {
    const r = this.rv, o = this.G.orders[r.orderId], it = o && o.items.find(i => i.id === r.drinkId);
    if (!it) return '';
    return `<div class="sheet-bg" data-a="closeRate"></div><div class="sheet">
      <div class="grab"></div><button class="xbtn" data-a="closeRate" aria-label="Schließen">✕</button>
      <div style="text-align:center"><div style="font-size:56px">${esc(it.emoji || '🍹')}</div><div class="h2" style="margin:6px 0 2px">${esc(it.name)}</div><div class="muted">Wie hat's dir geschmeckt?</div></div>
      <div class="starpick">${[1, 2, 3, 4, 5].map(n => `<button class="${n <= r.stars ? 'on' : ''}" data-a="star" data-v="${n}" aria-label="${n} Sterne">★</button>`).join('')}</div>
      <div class="starlbl">${['Tipp auf die Sterne', 'Nicht so gut 😕', 'Geht so', 'Gut 🙂', 'Sehr gut 😋', 'Hervorragend! 🤩'][r.stars]}</div>
      <div class="sec"><label class="lb">Kommentar (optional)</label><textarea class="in" id="g-rcomment" rows="3" maxlength="300" placeholder="Was hat dir gefallen?">${esc(r.comment)}</textarea></div>
      <button class="btn pri lg block sec" data-a="sendReview" ${r.stars ? '' : 'disabled'}>⭐ Bewertung abschicken</button>
    </div>`;
  },
  readyOverlay() {
    const o = this.ready;
    return `<div class="overlay"><div class="gl">🍹</div><h2>Dein Drink ist <span style="color:var(--green)">fertig!</span></h2>
      <div class="num">#${String(o.num).padStart(2, '0')}</div>
      <div class="muted" style="font-size:18px;max-width:320px">${esc(this.G.name)}, hol dir ${o.items.length === 1 ? 'deinen ' + esc(o.items[0].name) : 'deine Drinks'} an der Bar ab. Prost! 🥂</div>
      <button class="btn ok lg" data-a="closeReady" style="margin-top:10px">Bin unterwegs 👍</button>
      <div class="hint">Danach kannst du deinen Drink unter „Bestellungen“ mit ⭐ bewerten.</div></div>`;
  },
  act(a, ds) {
    switch (a) {
      case 'gview': this.view = ds.v; this.render(); window.scrollTo(0, 0); break;
      case 'cat': this.cat = ds.v; this.render(); break;
      case 'inc': { unlockAudio(); const n = Object.values(this.cart).reduce((x, y) => x + y, 0); if (n >= 30) { toast('Maximal 30 Drinks pro Bestellung'); return; } this.cart[ds.id] = Math.min(20, (this.cart[ds.id] || 0) + 1); buzz(15); this.render(); break; }
      case 'dec': this.cart[ds.id] = (this.cart[ds.id] || 0) - 1; if (this.cart[ds.id] <= 0) delete this.cart[ds.id]; if (!Object.keys(this.cart).length) this.cartOpen = false; this.render(); break;
      case 'openCart': this.cartOpen = true; this.render(); break;
      case 'closeCart': this.cartOpen = false; this.render(); break;
      case 'order': this.placeOrder(); break;
      case 'editName': this.editName = true; this.render(); break;
      case 'closeReady': this.ready = null; this.render(); break;
      case 'gcancel': {
        const o = this.G.orders[ds.id]; if (!o) return;
        if (this.cconfirm !== ds.id) { this.cconfirm = ds.id; this.render(); setTimeout(() => { if (this.cconfirm === ds.id) { this.cconfirm = null; safeRender(() => this.render()); } }, 4000); return; }
        this.cconfirm = null; this.G.pendingCancel[o.id] = Date.now();
        if (o.status === 'prep') { this.G.cancelReq[o.id] = true; toast('🙋 Storno angefragt – der Barkeeper wurde informiert'); }
        else { o.status = 'cancel'; toast('Bestellung storniert ✓'); buzz(40); }
        this.sendCancel(o.id); this.save(); this.render(); break;
      }
      case 'drinkInfo': this.detail = ds.id; this.render(); break;
      case 'closeDetail': this.detail = null; this.render(); break;
      case 'rate': { const k = ds.o + ':' + ds.id, old = this.G.rated[k]; this.rv = { orderId: ds.o, drinkId: ds.id, stars: old ? old.stars : 0, comment: old ? old.comment : '' }; this.render(); break; }
      case 'star': this.rv.stars = +ds.v; buzz(10); this.render(); break;
      case 'closeRate': this.rv = null; this.render(); break;
      case 'sendReview': {
        const r = this.rv; if (!r || !r.stars) return;
        if (!this.connected) { toast('Keine Verbindung – bitte gleich nochmal versuchen'); return; }
        this.pub({ t: 'review', guestId: this.G.guestId, review: { orderId: r.orderId, drinkId: r.drinkId, stars: r.stars, comment: r.comment.trim().slice(0, 300) } });
        this.G.rated[r.orderId + ':' + r.drinkId] = { stars: r.stars, comment: r.comment.trim().slice(0, 300) };
        this.save(); this.rv = null; this.render(); toast('Danke für deine Bewertung! 🙏'); break;
      }
    }
  },
  submit(f) {
    if (f === 'name') {
      unlockAudio();
      const v = document.getElementById('g-name').value.trim();
      if (v.length < 2) { toast('Bitte gib deinen Namen ein'); return; }
      this.G.name = v.slice(0, 30); this.editName = false; this.save(); this.render(); keepAwake();
    }
  },
  input(el) { if (el.id === 'g-note') this.note = el.value; if (el.id === 'g-rcomment' && this.rv) this.rv.comment = el.value; }
};

/* ---------- Start ---------- */
const hashBar = new URLSearchParams(location.hash.slice(1)).get('bar');
const App = hashBar ? Guest : Bar;
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; if (el.tagName === 'A') return; e.preventDefault(); App.act(el.dataset.a, el.dataset, el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && App.change) App.change(el.dataset.c, el); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault(); App.submit && App.submit(f.dataset.f); });
document.addEventListener('input', e => { if (App.input) App.input(e.target); });
window.addEventListener('hashchange', () => location.reload());
App.init(hashBar || undefined);
</script>
</body>
</html>
